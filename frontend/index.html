<!doctype html>
<html lang="en" data-mood="cinematic" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%236d4aff'/%3E%3Cstop offset='1' stop-color='%2300b8d9'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath d='M4 4h24v18H10l-6 6z' rx='6' fill='url(%23g)'/%3E%3Ccircle cx='11' cy='13' r='2' fill='%23fff'/%3E%3Ccircle cx='16' cy='13' r='2' fill='%23fff'/%3E%3Ccircle cx='21' cy='13' r='2' fill='%23fff'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800;900&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <title>anon — talk to anyone, stay no one</title>
    <script>
      // apply mood + theme before paint. Each mood forces its own theme
      // (cinematic = dark, airy = light) unless the user flipped it for that mood.
      try {
        const d = document.documentElement
        const m = localStorage.getItem('anon.mood') || 'cinematic'
        d.dataset.mood = m
        d.dataset.theme = localStorage.getItem('anon.theme.' + m) || (m === 'airy' ? 'light' : 'dark')
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
